tagline: 'Best set-and-forget SERVER distro — rock-solid, conservative, runs forever. Wrong for an AI desktop in 2026. NVIDIA drivers live in non-free + contrib; DKMS silently fails unless you install kernel-headers first; stable and backports both still ship the 550.163.01 driver (`550.163.01-4~bpo13+1`), and it fails to build against the 7.2 kernel now in trixie-backports (Debian bug #1148283, 2026-09-18). 2-year stable release cycle = ancient packages — "from when AI meant chess engines."'
